name: build and publish ${{ vars.VERSION }}

on: workflow_dispatch

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish Doodly/Doodly.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: doodly-win-x64
          path: publish/win-x64/

  package-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish Doodly/Doodly.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o publish/linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: doodly-linux-x64
          path: publish/linux-x64/

  package-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish Doodly/Doodly.csproj
          --configuration Release
          --runtime osx-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o publish/osx-x64
      - uses: actions/upload-artifact@v4
        with:
          name: doodly-macos-x64
          path: publish/osx-x64/

