name: build and publish

on: workflow_dispatch

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish Doodly/Doodly.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: doodly-win-x64-v${{vars.VERSION}}
          path: publish/win-x64/

  package-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish Doodly/Doodly.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o publish/linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: doodly-linux-x64-v${{vars.VERSION}}
          path: publish/linux-x64/

  package-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish Doodly/Doodly.csproj
          --configuration Release
          --runtime osx-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o publish/osx-x64
      - uses: actions/upload-artifact@v4
        with:
          name: doodly-macos-x64-v${{vars.VERSION}}
          path: publish/osx-x64/

  package:
    needs:
      - package-windows
      - package-linux
      - package-macos
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ vars.APP_VERSION }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release archives
        working-directory: artifacts
        env:
          VERSION: ${{ vars.VERSION }}
        run: |
          cd artifacts

          for platform in win-x64 linux-x64 macos-x64; do
          if [ ! -d "doodly-$platform" ]; then
          echo "Missing: doodly-$platform"
          exit 1
          fi

          zip -rq "../doodly-$platform-v${VERSION}.zip" "doodly-$platform"
          tar -czf "../doodly-$platform-v${VERSION}.tar.gz" "doodly-$platform"
          done
