name: build and publish

permissions:
  contents: write

on: workflow_dispatch

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish Doodly/Doodly.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: doodly-win-x64-v${{vars.VERSION}}
          path: publish/win-x64/

  package-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish Doodly/Doodly.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o publish/linux-x64
      - name: Install FPM
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm
      - name: Build Debian package
        env:
          VERSION: ${{ vars.VERSION }}
        run: |
          fpm -s dir -t deb \
            --name doodly \
            --version "$VERSION" \
            --architecture amd64 \
            --maintainer "Doodly maintainers" \
            --description "Draw and edit images" \
            --prefix /opt/doodly \
            -C publish/linux-x64 .
      - uses: actions/upload-artifact@v4
        with:
          name: doodly-linux-x64-v${{ vars.VERSION }}
          path: publish/linux-x64/
      - uses: actions/upload-artifact@v4
        with:
          name: doodly-debian-amd64-v${{ vars.VERSION }}
          path: doodly_*_amd64.deb

  package-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish Doodly/Doodly.csproj
          --configuration Release
          --runtime osx-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o publish/osx-x64
      - uses: actions/upload-artifact@v4
        with:
          name: doodly-macos-x64-v${{vars.VERSION}}
          path: publish/osx-x64/

  compressed-packages:
    needs:
      - package-windows
      - package-linux
      - package-macos
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ vars.APP_VERSION }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release archives
        working-directory: artifacts
        env:
          VERSION: ${{ vars.VERSION }}
        run: |
          set -e
          for platform in win-x64 linux-x64 macos-x64; do
            dir="doodly-${platform}-v${VERSION}"
            zip -rq "../${dir}.zip" "$dir"
            tar -czf "../${dir}.tar.gz" "$dir"
          done
  publish:
    needs: compressed-packages
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ vars.VERSION }}
          name: Doodly v${{ vars.VERSION }}
          files: |
            *.zip
            *.tar.gz
            artifacts/doodly-debian-amd64-v${{ vars.VERSION }}/*.deb
